<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Supabase V2</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:60px auto;padding:0 20px;line-height:1.5}
button{font:inherit;padding:12px 18px;cursor:pointer}
#status{margin-top:20px;padding:14px;background:#f3f4f6;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Test de connexion Supabase V2</h1>
<p>Ce test envoie uniquement une fausse réponse technique dans <code>questionnaire_responses_v2</code>.</p>
<button id="send">Envoyer une réponse test</button>
<div id="status">Aucun test envoyé.</div>
<script>
const SUPABASE_URL = "https://wnhunsumbxjjjypcnaok.supabase.co";
const SUPABASE_KEY = "sb_publishable_q-dNYVIHbB-VFXLhtfTHZA_bxfmofji";

document.getElementById("send").addEventListener("click", async () => {
  const status = document.getElementById("status");
  status.textContent = "Envoi en cours…";

  const payload = {
    app_version: "BROWSER-TEST-V2",
    seminar_code: "TEST_BROWSER_V2",
    study_consent: true,
    consent_version: "v2-2026-09",
    respondent_type: "self",
    age_band: "18_39",
    gender: "prefer_not",
    result_priority: "green",
    plaque_index: null,
    answers: { browser_test: true }
  };

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/questionnaire_responses_v2",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(payload)
      }
    );

    const body = await response.text();
    if (response.ok) {
      status.textContent = "✅ SUCCÈS — HTTP " + response.status +
        "\nLa réponse test a été acceptée par Supabase.";
    } else {
      status.textContent = "❌ ÉCHEC — HTTP " + response.status +
        "\n" + (body || "Aucun détail renvoyé.");
    }
  } catch (err) {
    status.textContent = "❌ ERREUR NAVIGATEUR\n" + err.name + ": " + err.message;
  }
});
</script>
</body>
</html>
